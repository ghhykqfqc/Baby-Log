<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <!-- 云朵主体渐变：天蓝 → 薰衣草 → 樱粉 → 蜜桃 -->
    <linearGradient id="cloudG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8FC8F0"/>
      <stop offset="0.42" stop-color="#BEC8F2"/>
      <stop offset="0.72" stop-color="#F2B9D4"/>
      <stop offset="1" stop-color="#FFB9A6"/>
    </linearGradient>
  </defs>

  <!-- 玻璃描边底层：整体放大的白色云，形成磨砂玻璃边缘 -->
  <g fill="#FFFFFF" fill-opacity="0.75" transform="translate(150,100) scale(1.05) translate(-150,-100)">
    <circle cx="205" cy="92" r="58"/>
    <circle cx="88" cy="104" r="48"/>
    <circle cx="148" cy="64" r="40"/>
    <circle cx="252" cy="122" r="30"/>
    <rect x="42" y="110" width="216" height="58" rx="29"/>
  </g>

  <!-- 云朵主体（纯渐变，无内部线条） -->
  <g fill="url(#cloudG)">
    <circle cx="205" cy="92" r="58"/>
    <circle cx="88" cy="104" r="48"/>
    <circle cx="148" cy="64" r="40"/>
    <circle cx="252" cy="122" r="30"/>
    <rect x="42" y="110" width="216" height="58" rx="29"/>
  </g>

  <!-- 居中语音图标（麦克风） -->
  <g fill="#FFFFFF">
    <rect x="134" y="38" width="32" height="54" rx="16"/>
    <rect x="147.5" y="90" width="5" height="16" rx="2.5"/>
    <path d="M 128 100 a 22 22 0 0 0 44 0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <rect x="137" y="121" width="26" height="5" rx="2.5"/>
  </g>
</svg>
